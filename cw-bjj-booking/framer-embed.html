<!--
  Canary Wharf BJJ booking flow: Framer Embed snippet (HTML mode).

  1. Points at scratch-delta-three.vercel.app. If the Vercel address changes, update it in both places below.
  2. In Framer, add an Embed to the booking page, set it to HTML, paste all of this in.
  3. Set the Embed's width to Fill and its height to Fit Content (or a tall fixed height).

  Class pages can deep link with ?programme=gi on the Framer page URL; it's passed through.
  Paste it only in the Embed, not in Site Settings > Custom Code as well, or the page scrolls twice.
-->
<div id="cwbjj-booking-wrap" style="width:100%">
  <iframe
    id="cwbjj-booking"
    title="Book your first class at Canary Wharf BJJ"
    src="https://scratch-delta-three.vercel.app/"
    style="display:block;width:100%;height:900px;border:0;background:transparent"
    scrolling="no"
    allow="payment"
  ></iframe>
</div>
<script>
  (function () {
    var APP_ORIGIN = "https://scratch-delta-three.vercel.app";
    var AUTO_SCROLL = true; /* set to false to stop the page scrolling to each new step */
    var SCROLL_DURATION = 900; /* ms. Higher is slower; 0 uses the browser's own quicker smooth scroll. Keep it under about 900 so the scroll finishes before the calendar loads. */
    var BREATHING_ROOM = 0.12; /* share of the viewport left above a step when scrolling */

    /*
      Framer runs Embed HTML inside its own same-origin frame, which can't scroll
      and has no address of its own. Use the outermost page we can reach instead.
    */
    function findHost() {
      var host = window;
      try {
        while (host !== host.parent && host.parent.document) host = host.parent;
      } catch (e) {}
      return host;
    }
    var host = findHost();

    var frame = document.getElementById("cwbjj-booking");
    if (frame) {
      var programme = new URLSearchParams(host.location.search).get("programme");
      if (programme) {
        var url = new URL(frame.getAttribute("src"));
        url.searchParams.set("programme", programme);
        frame.setAttribute("src", url.toString());
      }
    }

    if (window.__cwbjjBookingListener) return;
    window.__cwbjjBookingListener = true;

    /* The iframe that holds the app, or the frame that Framer wrapped around it. */
    function findFrame(source) {
      var frames = document.getElementsByTagName("iframe");
      for (var i = 0; i < frames.length; i++) {
        var w = frames[i].contentWindow;
        if (w === source) return frames[i];
        try {
          if (w === source.parent) return frames[i];
        } catch (e) {}
      }
      return null;
    }

    /* Top of an element in the host page, through any frames in between. */
    function topInHost(el) {
      var top = el.getBoundingClientRect().top;
      var w = el.ownerDocument.defaultView;
      while (w && w !== host && w.frameElement) {
        top += w.frameElement.getBoundingClientRect().top;
        w = w.parent;
      }
      return top + host.scrollY;
    }

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var scrollFrame = 0;
    function stopScroll() {
      host.cancelAnimationFrame(scrollFrame);
      scrollFrame = 0;
    }
    /* Never fight the visitor: their own scroll or touch stops ours. */
    host.addEventListener("wheel", stopScroll, { passive: true });
    host.addEventListener("touchstart", stopScroll, { passive: true });

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function scrollHostTo(to) {
      stopScroll();
      var from = host.scrollY;
      var distance = to - from;
      if (Math.abs(distance) < 2) return;
      if (reduceMotion.matches) return host.scrollTo(0, to);
      if (!(SCROLL_DURATION > 0)) return host.scrollTo({ top: to, behavior: "smooth" });
      var start = host.performance.now();
      function step(now) {
        var t = Math.min(1, (now - start) / SCROLL_DURATION);
        host.scrollTo(0, from + distance * easeInOutCubic(t));
        scrollFrame = t < 1 ? host.requestAnimationFrame(step) : 0;
      }
      scrollFrame = host.requestAnimationFrame(step);
    }

    window.addEventListener("message", function (event) {
      if (event.origin !== APP_ORIGIN) return;
      var data = event.data || {};
      var target = findFrame(event.source);
      if (!target) return;

      if (data.type === "cwbjj-booking-height" && typeof data.height === "number") {
        target.style.height = data.height + "px";
      }

      if (AUTO_SCROLL && data.type === "cwbjj-booking-scroll" && typeof data.top === "number") {
        var to = topInHost(target) + data.top - host.innerHeight * BREATHING_ROOM;
        scrollHostTo(Math.max(0, to));
      }
    });
  })();
</script>
