<!-- ============================================================
  Balance Martial Arts — Canary Wharf BJJ
  Floating WhatsApp chat widget (self-contained, no dependencies)
  Paste into Framer: Site Settings → Custom Code → End of <body>
============================================================= -->
<div id="bma-wa-root">
  <style>
    #bma-wa-root, #bma-wa-root * { margin: 0; padding: 0; box-sizing: border-box; }
    #bma-wa-root {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      pointer-events: none; /* children re-enable */
    }

    /* ---------- Launcher (collapsed state) ---------- */
    #bma-wa-launcher {
      pointer-events: auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      margin-left: auto;
      border: 0;
      border-radius: 50%;
      background: #25d366;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: scale(0.4);
      animation: bma-wa-launcher-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 1.5s forwards;
    }
    #bma-wa-launcher svg { width: 32px; height: 32px; display: block; }
    #bma-wa-launcher:hover { filter: brightness(1.05); }
    #bma-wa-root.bma-wa-open #bma-wa-launcher { display: none; }

    @keyframes bma-wa-launcher-in {
      0%   { opacity: 0; transform: scale(0.4); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Pulse ring — loops while collapsed and not yet interacted with */
    #bma-wa-launcher::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.55);
      animation: bma-wa-pulse 2.2s ease-out 2.1s infinite;
      pointer-events: none;
    }
    #bma-wa-root.bma-wa-touched #bma-wa-launcher::before { animation: none; }

    @keyframes bma-wa-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.55); }
      70%  { box-shadow: 0 0 0 16px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 16px rgba(37, 211, 102, 0); }
    }

    /* Red notification dot on the launcher */
    #bma-wa-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ff3b30;
      border: 2px solid #ffffff;
    }
    #bma-wa-root.bma-wa-open #bma-wa-badge,
    #bma-wa-root.bma-wa-read #bma-wa-badge { display: none; }

    /* ---------- Card (open state) ---------- */
    #bma-wa-card {
      pointer-events: auto;
      display: none;
      width: 320px;
      max-width: calc(100vw - 24px);
      padding: 22px;
      border-radius: 20px;
      background: #272727;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      transform-origin: bottom right;
    }
    #bma-wa-root.bma-wa-open #bma-wa-card { display: block; }

    /* First (auto) open: springy scale + rise */
    #bma-wa-root.bma-wa-open.bma-wa-anim #bma-wa-card {
      animation: bma-wa-card-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes bma-wa-card-in {
      0%   { opacity: 0; transform: scale(0.9) translateY(14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Manual reopen: fast plain fade, no stagger */
    #bma-wa-root.bma-wa-open.bma-wa-fast #bma-wa-card {
      animation: bma-wa-card-fast 0.15s ease-out both;
    }
    @keyframes bma-wa-card-fast {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Header row */
    #bma-wa-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-right: 24px; /* keep clear of the close button */
    }
    #bma-wa-avatar {
      position: relative;
      flex: 0 0 auto;
      width: 60px;
      height: 60px;
    }
    #bma-wa-avatar > svg {
      width: 60px;
      height: 60px;
      display: block;
      border-radius: 50%;
    }
    #bma-wa-status-dot {
      position: absolute;
      right: 1px;
      bottom: 1px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2ecc71;
      border: 2.5px solid #272727;
    }
    #bma-wa-name {
      font-size: 19px;
      line-height: 1.25;
      font-weight: 700;
      color: #ffffff;
    }
    #bma-wa-presence {
      margin-top: 2px;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 400;
      color: #a1a1a1;
    }

    /* Close button */
    #bma-wa-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: #949494;
      cursor: pointer;
      border-radius: 8px;
    }
    #bma-wa-close:hover { color: #cacaca; }
    #bma-wa-close svg { width: 16px; height: 16px; display: block; }
    #bma-wa-card { position: relative; }

    /* Divider — spans the full card width */
    #bma-wa-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 18px -22px 16px;
    }

    /* Faint timestamp above the bubble */
    #bma-wa-time {
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.14);
      margin-bottom: 12px;
      user-select: none;
    }

    /* Message bubble with top-left tail */
    #bma-wa-bubble {
      position: relative;
      background: #616161;
      color: #ffffff;
      border-radius: 16px;
      border-top-left-radius: 4px;
      padding: 14px 16px;
      margin-left: 8px;
      margin-right: 6px;
      font-size: 16px;
      line-height: 1.45;
    }
    #bma-wa-bubble::before {
      content: "";
      position: absolute;
      top: 0;
      left: -8px;
      width: 0;
      height: 0;
      border-top: 12px solid #616161;
      border-left: 9px solid transparent;
    }

    /* CTA button */
    #bma-wa-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 50px;
      margin-top: 20px;
      border-radius: 25px;
      background: #4ad06a;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      font-family: inherit;
    }
    #bma-wa-cta:hover { filter: brightness(1.04); }
    #bma-wa-cta svg { width: 24px; height: 24px; display: block; flex: 0 0 auto; }

    /* Staggered reveal on the first (auto) open only */
    #bma-wa-root.bma-wa-open.bma-wa-anim #bma-wa-bubble,
    #bma-wa-root.bma-wa-open.bma-wa-anim #bma-wa-cta {
      opacity: 0;
      animation: bma-wa-rise 0.35s ease-out forwards;
    }
    #bma-wa-root.bma-wa-open.bma-wa-anim #bma-wa-bubble { animation-delay: 0.18s; }
    #bma-wa-root.bma-wa-open.bma-wa-anim #bma-wa-cta    { animation-delay: 0.28s; }
    @keyframes bma-wa-rise {
      0%   { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Small screens */
    @media (max-width: 420px) {
      #bma-wa-root { right: 12px; bottom: 14px; }
      #bma-wa-card { padding: 18px; }
      #bma-wa-divider { margin-left: -18px; margin-right: -18px; }
      #bma-wa-name { font-size: 18px; }
      #bma-wa-bubble { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #bma-wa-root *, #bma-wa-root *::before { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    }
  </style>

  <!-- Open card -->
  <div id="bma-wa-card" role="dialog" aria-label="Chat with Balance Martial Arts — Canary Wharf BJJ on WhatsApp">

        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </button>

      var h = now.getHours(), m = now.getMinutes();
      var ampm = h >= 12 ? "PM" : "AM";
      timeEl.textContent = ((h % 12) || 12) + ":" + (m < 10 ? "0" : "") + m + " " + ampm;

      var KEY = "bmaWaDismissed";
      function dismissed() {
        try { return sessionStorage.getItem(KEY) === "1"; } catch (e) { return false; }
      }
      function remember() {
        try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
      }

      function open(fast) {
        root.classList.add("bma-wa-open", "bma-wa-touched", "bma-wa-read");
        root.classList.toggle("bma-wa-fast", !!fast);
        root.classList.toggle("bma-wa-anim", !fast);
      }
      function close() {
        root.classList.remove("bma-wa-open", "bma-wa-anim", "bma-wa-fast", "bma-wa-read");
        remember();
      }

      launcher.addEventListener("click", function () { open(true); });
      closeBtn.addEventListener("click", close);

      // Launcher pops in at 1.5s; card auto-opens ~2.5s later — unless
      // it was dismissed earlier this browser session.
      if (!dismissed()) {
        setTimeout(function () {
          if (!root.classList.contains("bma-wa-open") && !dismissed()) open(false);
        }, 4000);
      }
    })();
  </script>
</div>
